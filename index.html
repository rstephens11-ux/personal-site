<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RYAN.STEPHENS ::</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body{overflow:hidden;height:100vh}
  .hero{min-height:100vh}
</style>
<meta name="description" content="Ryan Stephens — projects, garden, and life on Midcoast Maine.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
</head>
<body>
<div class="scanlines"></div>
<div class="grain"></div>
<div class="vignette"></div>
<div class="load-fade" id="loadfade"></div>
<div class="wrap">

<section class="hero" id="top">
  <div class="bg-maine" aria-hidden="true"></div>
  <a class="vehicle" href="home.html" aria-label="Enter site">
    <div class="truck"><img src="hero-truck-family-sprite.png" alt=""></div>
  </a>

  <h1 class="hero-name"><span class="glitch" data-text="RYAN STEPHENS">RYAN STEPHENS</span><span class="dot">.</span></h1>


  <div class="pending">
    <div class="p">&gt; welcome to my website.</div>
  </div>
</section>

</div>
<script src="scripts.js"></script>
<script>
(function(){
  var truck = document.querySelector('.vehicle');
  var fade = document.getElementById('loadfade');
  if(truck && fade){
    truck.addEventListener('click', function(e){
      e.preventDefault();
      truck.classList.add('driving');
      setTimeout(function(){ fade.classList.add('on'); }, 600);
      setTimeout(function(){ window.location.href = 'home.html'; }, 1250);
    });
  }
})();
</script>
</body>
</html>
